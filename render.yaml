databases:
  - name: instaautouz-db
    databaseName: instaautouz
    user: admin
    plan: free

services:
  - type: web
    name: instaautouz-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: instaautouz-db
          property: connectionString
      # Quyidagi o'zgaruvchilar Render panelidan kiritiladi:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_VERSION
        value: 20

  - type: web
    name: instaautouz-client
    env: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Render o'zgaruvchilari panelidan kiritiladi:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: VITE_TELEGRAM_BOT_USERNAME
        sync: false
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
